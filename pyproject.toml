[project]
name = "maktabdl"
version = "0.1.0"
description = "Async Maktabkhooneh course downloader"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "rich>=13.7,<15",
]

[project.scripts]
maktabdl = "maktabdl.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maktabdl"]
